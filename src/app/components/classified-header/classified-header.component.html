<div class="bar">
  <div class="bar__id">
    <span class="bar__dot" aria-hidden="true"></span>
    <span class="bar__code">{{ dossier.id }}</span>
  </div>

  <nav class="rail" aria-label="Fases del expediente">
    <ol class="rail__list">
      @for (phase of experience.phases; track phase.id; let i = $index) {
        <li>
          <button
            type="button"
            class="rail__step"
            [class.is-reached]="isReached(i)"
            [class.is-active]="phase.id === experience.activePhaseId()"
            [attr.aria-current]="phase.id === experience.activePhaseId() ? 'step' : null"
            (click)="goToPhase(phase)"
          >
            <span class="sr-only">{{ phase.code }} — {{ phase.title }}</span>
            <span class="rail__mark" aria-hidden="true"></span>
          </button>
        </li>
      }
    </ol>

    <p class="rail__now" aria-live="polite">
      <span class="rail__now-code">{{ activePhase().code }}</span>
      <span class="rail__now-title">{{ activePhase().title }}</span>
    </p>
  </nav>

  <button
    type="button"
    class="sound"
    [class.is-on]="audio.enabled()"
    [attr.aria-pressed]="audio.enabled()"
    (click)="audio.toggle()"
  >
    <span class="sr-only">Sonido del expediente</span>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M4 9.5h3.6L12 5.8v12.4L7.6 14.5H4z"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
      @if (audio.enabled()) {
        <path
          d="M15.4 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      } @else {
        <path
          d="m16 9.6 4.4 4.8m0-4.8L16 14.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      }
    </svg>
  </button>
</div>

<div class="progress" aria-hidden="true"><span class="progress__fill"></span></div>
